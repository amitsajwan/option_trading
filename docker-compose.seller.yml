# S3 seller service overlay — adds the seller daemon to the compose stack.
# Moved out of docs/archive/ 2026-07-08 when SELLER_LIVE_ENABLED went live for real —
# this is now live trading infra, not an archived reference doc.
# Deploy:
#   docker compose --env-file .env.compose -f docker-compose.yml -f docker-compose.gcp.yml \
#       -f docker-compose.seller.yml --profile ui build strategy_app dashboard seller_app
#   docker compose ... up -d
# PAPER by default (this file's own default is 0) — SELLER_LIVE_ENABLED=1 is set in
# .env.compose on the runtime VM only. Real money requires EXECUTION_ADAPTER=dhan too.
services:
  seller_app:
    build:
      context: .
      dockerfile: market_data_dashboard/Dockerfile   # has pymongo + strategy_app + seller code
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - mongo
    environment:
      TZ: "Asia/Kolkata"
      PYTHONPATH: /app
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: trading_ai
      STRATEGY_RUN_DIR: /seller_run
      EXECUTION_ADAPTER: "${EXECUTION_ADAPTER:-paper}"
      # Real-money credentials — required when EXECUTION_ADAPTER=dhan + SELLER_LIVE_ENABLED=1,
      # else DhanAdapter() raises at startup (safe-fail, but must be wired for real trading to work).
      DHAN_CLIENT_ID: "${DHAN_CLIENT_ID:-}"
      DHAN_ACCESS_TOKEN: "${DHAN_ACCESS_TOKEN:-}"
      DHAN_PRODUCT_TYPE: "${DHAN_PRODUCT_TYPE:-MARGIN}"
      SELLER_LIVE_ENABLED: "${SELLER_LIVE_ENABLED:-0}"
      SELLER_CONDOR_OFFSET: "${SELLER_CONDOR_OFFSET:-200}"
      SELLER_IV_RANK_MIN: "${SELLER_IV_RANK_MIN:-30}"
      SELLER_SPREAD_WIDTH: "${SELLER_SPREAD_WIDTH:-300}"
      SELLER_TP_FRAC: "${SELLER_TP_FRAC:-0.50}"
      SELLER_STOP_MULT: "${SELLER_STOP_MULT:-2.0}"
      SELLER_MAX_HOLD_DAYS: "${SELLER_MAX_HOLD_DAYS:-5}"
      SELLER_ENTRY_WINDOW: "${SELLER_ENTRY_WINDOW:-10:00-14:00}"
      SELLER_LOOP_INTERVAL_S: "${SELLER_LOOP_INTERVAL_S:-30}"
      # Risk caps (code defaults 1 / 6000 if unset — surfaced here for visibility + contract pin).
      SELLER_MAX_CONCURRENT: "${SELLER_MAX_CONCURRENT:-1}"
      SELLER_DAILY_LOSS_CAP_RS: "${SELLER_DAILY_LOSS_CAP_RS:-6000}"
      # Phase 0 (2026-07-10): entry-failure latch + margin pre-check + buyer
      # coordination flag on the shared host .run mount (buyer yields to seller).
      SELLER_ENTRY_FAIL_LATCH: "${SELLER_ENTRY_FAIL_LATCH:-2}"
      SELLER_MIN_FREE_MARGIN_RS: "${SELLER_MIN_FREE_MARGIN_RS:-60000}"
      SELLER_STOP_CONFIRM_BARS: "${SELLER_STOP_CONFIRM_BARS:-2}"
      SHARED_RUN_DIR: /shared_run
      BANKNIFTY_LOT_SIZE: "${BANKNIFTY_LOT_SIZE:-30}"
      # Telegram trade alerts (2026-07-08: seller had none — real-money trades were invisible).
      ALERT_ENABLED: "${ALERT_ENABLED:-0}"
      ALERT_TELEGRAM_TOKEN: "${ALERT_TELEGRAM_TOKEN:-}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-}"
    volumes:
      - seller_run:/seller_run
      - ./.run:/shared_run   # buyer-coordination flag lives here (same mount as strategy_app's /app/.run)
    command: ["python", "-m", "strategy_app.seller"]
    healthcheck:
      disable: true   # daemon has no HTTP endpoint; the dashboard healthcheck doesn't apply

  # NIFTY seller (2026-07-10): same image/code, instrument-scoped by env.
  # Weekly expiries, 50-pt strikes -> tighter offsets/width than BN monthly.
  seller_app_nifty:
    image: option_trading-seller_app
    restart: unless-stopped
    working_dir: /app
    depends_on:
      - mongo
    environment:
      TZ: "Asia/Kolkata"
      PYTHONPATH: /app
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: trading_ai
      STRATEGY_INSTRUMENT: NIFTY
      STRATEGY_RUN_DIR: /seller_run
      EXECUTION_ADAPTER: "${EXECUTION_ADAPTER:-paper}"
      DHAN_CLIENT_ID: "${DHAN_CLIENT_ID:-}"
      DHAN_ACCESS_TOKEN: "${DHAN_ACCESS_TOKEN:-}"
      DHAN_PRODUCT_TYPE: "${DHAN_PRODUCT_TYPE:-MARGIN}"
      SELLER_LIVE_ENABLED: "${SELLER_LIVE_ENABLED:-0}"
      NIFTY_LOT_SIZE: "${NIFTY_LOT_SIZE:-65}"
      SELLER_CONDOR_OFFSET: "${NIFTY_SELLER_CONDOR_OFFSET:-100}"
      SELLER_IV_RANK_MIN: "${SELLER_IV_RANK_MIN:-30}"
      SELLER_SPREAD_WIDTH: "${NIFTY_SELLER_SPREAD_WIDTH:-150}"
      SELLER_TP_FRAC: "${SELLER_TP_FRAC:-0.50}"
      SELLER_STOP_MULT: "${SELLER_STOP_MULT:-2.0}"
      SELLER_MAX_HOLD_DAYS: "${SELLER_MAX_HOLD_DAYS:-10}"
      SELLER_ENTRY_WINDOW: "${SELLER_ENTRY_WINDOW:-10:00-14:00}"
      SELLER_LOOP_INTERVAL_S: "${SELLER_LOOP_INTERVAL_S:-30}"
      SELLER_MAX_CONCURRENT: "${SELLER_MAX_CONCURRENT:-1}"
      SELLER_DAILY_LOSS_CAP_RS: "${SELLER_DAILY_LOSS_CAP_RS:-6000}"
      SELLER_ENTRY_FAIL_LATCH: "${SELLER_ENTRY_FAIL_LATCH:-2}"
      SELLER_MIN_FREE_MARGIN_RS: "${NIFTY_SELLER_MIN_FREE_MARGIN_RS:-45000}"
      SELLER_STOP_CONFIRM_BARS: "${SELLER_STOP_CONFIRM_BARS:-2}"
      SHARED_RUN_DIR: /shared_run
      ALERT_ENABLED: "${ALERT_ENABLED:-0}"
      ALERT_TELEGRAM_TOKEN: "${ALERT_TELEGRAM_TOKEN:-}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-}"
    volumes:
      - seller_nifty_run:/seller_run
      - ./.run:/shared_run
    command: ["python", "-m", "strategy_app.seller"]
    healthcheck:
      disable: true

  # Use the LOCAL build of the dashboard (with the /seller route baked in) instead of the
  # pinned GHCR image, so the route survives recreate. (gcp override pins image+pull_policy:always.)
  dashboard:
    build:
      context: .
      dockerfile: market_data_dashboard/Dockerfile
    pull_policy: never

volumes:
  seller_run:
  seller_nifty_run:
