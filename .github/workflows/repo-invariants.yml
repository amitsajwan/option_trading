name: Repo invariants

# Static, no-container checks -- catches config/doc rot before it ships.
# Born 2026-09-16 after two real bugs (BankNifty/NIFTY sellers reading
# unnamespaced live-mode env vars, FINNIFTY buyer missing operator_halt)
# sat unnoticed for a week each. Both scripts are stdlib-only and run in
# seconds; see ops/check_safety_invariants.py and ops/check_doc_links.py
# for what they check and why.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Safety invariants + doc links
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Safety invariants (seller namespacing, buyer halt coverage)
        run: python3 ops/check_safety_invariants.py

      - name: Doc links (docs/archive/ excluded -- frozen historical snapshots)
        run: python3 ops/check_doc_links.py

      - name: Stale infra references (retired GCP project/VM identifiers)
        run: python3 ops/check_stale_infra_refs.py
