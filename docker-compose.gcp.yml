services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --client-output-buffer-limit "normal 0 0 0 slave 268435456 67108864 60 pubsub 0 0 0"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingestion_app:
    build:
      context: .
      dockerfile: ingestion_app/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      TZ: "Asia/Kolkata"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: "${MONGO_DB:-trading_ai}"
      INSTRUMENT_SYMBOL: "${INSTRUMENT_SYMBOL:-BANKNIFTY26JULFUT}"
      # 2026-07-21: ingestion_app is the WS-feed owner (PRIMARY_INSTRUMENT) —
      # needs NIFTY's futures symbol too, to build the shared WS leg list
      # (see ingestion_app/dhan_ws_feed.py::build_shared_legs). Same var
      # ingestion_app_nifty already uses for its own INSTRUMENT_SYMBOL below.
      NIFTY_INSTRUMENT_SYMBOL: "${NIFTY_INSTRUMENT_SYMBOL:-NIFTY26JULFUT}"
      # Same reasoning as NIFTY_INSTRUMENT_SYMBOL above — the shared WS owner
      # needs FINNIFTY's futures symbol too, to build its leg (2026-08-03).
      FINNIFTY_INSTRUMENT_SYMBOL: "${FINNIFTY_INSTRUMENT_SYMBOL:-FINNIFTY26AUGFUT}"
      KITE_CREDENTIALS_PATH: "${KITE_CREDENTIALS_PATH:-/app/secrets/credentials.json}"
      BROKER: "${BROKER:-kite}"
      DHAN_CLIENT_ID: "${DHAN_CLIENT_ID:-}"
      DHAN_ACCESS_TOKEN: "${DHAN_ACCESS_TOKEN:-}"
      MARKET_SESSION_ENABLED: "${MARKET_SESSION_ENABLED:-1}"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-Asia/Kolkata}"
      MARKET_OPEN_TIME: "${MARKET_OPEN_TIME:-09:15}"
      MARKET_CLOSE_TIME: "${MARKET_CLOSE_TIME:-15:30}"
      NSE_HOLIDAYS_FILE: "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}"
      IDLE_SLEEP_SECONDS: "${IDLE_SLEEP_SECONDS:-60}"
      INGESTION_COLLECTORS_ENABLED: "${INGESTION_COLLECTORS_ENABLED:-0}"
      LIVE_TOPIC: "${LIVE_TOPIC:-market:snapshot:v1}"
      HISTORICAL_TOPIC: "${HISTORICAL_TOPIC:-market:snapshot:v1:historical}"
      SNAPSHOT_V1_TOPIC: "${LIVE_TOPIC:-market:snapshot:v1}"
    command:
      [
        "python",
        "-m",
        "ingestion_app.market_session_runner",
        "--mode",
        "live",
        "--holidays-file",
        "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}",
        "--idle-sleep-seconds",
        "${IDLE_SLEEP_SECONDS:-60}",
        "--state-file",
        "/app/.run/ingestion_app/session_state.json",
      ]
    volumes:
      - ./.run:/app/.run
      - ./ingestion_app/credentials.json:/app/secrets/credentials.json:ro
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro
    ports:
      - "${INGESTION_API_PORT:-8004}:8004"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "ingestion_app.market_session_runner",
          "--healthcheck",
          "--state-file",
          "/app/.run/ingestion_app/session_state.json",
          "--max-stale-seconds",
          "240",
        ]
      interval: 60s
      timeout: 15s
      retries: 3

  snapshot_app:
    build:
      context: .
      dockerfile: snapshot_app/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      ingestion_app:
        condition: service_healthy
    environment:
      TZ: "Asia/Kolkata"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: "${MONGO_DB:-trading_ai}"
      INSTRUMENT_SYMBOL: "${INSTRUMENT_SYMBOL:-BANKNIFTY26JULFUT}"
      KITE_CREDENTIALS_PATH: "${KITE_CREDENTIALS_PATH:-/app/secrets/credentials.json}"
      MARKET_SESSION_ENABLED: "${MARKET_SESSION_ENABLED:-1}"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-Asia/Kolkata}"
      MARKET_OPEN_TIME: "${MARKET_OPEN_TIME:-09:15}"
      MARKET_CLOSE_TIME: "${MARKET_CLOSE_TIME:-15:30}"
      NSE_HOLIDAYS_FILE: "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}"
      IDLE_SLEEP_SECONDS: "${IDLE_SLEEP_SECONDS:-60}"
      LIVE_TOPIC: "${LIVE_TOPIC:-market:snapshot:v1}"
      HISTORICAL_TOPIC: "${HISTORICAL_TOPIC:-market:snapshot:v1:historical}"
      SNAPSHOT_V1_TOPIC: "${LIVE_TOPIC:-market:snapshot:v1}"
      ML_PIPELINE_DISABLE_KITE_BACKFILL: "${ML_PIPELINE_DISABLE_KITE_BACKFILL:-1}"
      CROSS_ASSET_ENABLED: "${CROSS_ASSET_ENABLED:-0}"
      NIFTY_FUT_SYMBOL: "${NIFTY_FUT_SYMBOL:-NFO:NIFTY26JUNFUT}"
      BLOCK_TRADE_MIN_LOTS: "${BLOCK_TRADE_MIN_LOTS:-5}"
      BANKNIFTY_LOT_SIZE: "${BANKNIFTY_LOT_SIZE:-15}"
    command:
      [
        "python",
        "-m",
        "snapshot_app.main_live",
        "--foreground",
        "--instrument",
        "${INSTRUMENT_SYMBOL:-BANKNIFTY26JULFUT}",
        "--market-api-base",
        "http://ingestion_app:8004",
        "--dashboard-api-base",
        "${SNAPSHOT_DASHBOARD_API_BASE:-}",
        "--out-jsonl",
        "/app/.run/snapshot_app/events.jsonl",
      ]
    volumes:
      - ./.run:/app/.run
      - ./ingestion_app/credentials.json:/app/secrets/credentials.json:ro
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "snapshot_app.health",
          "--events-path",
          "/app/.run/snapshot_app/events.jsonl",
          "--max-age-seconds",
          "300",
        ]
      interval: 20s
      timeout: 5s
      retries: 5

  persistence_app:
    build:
      context: .
      dockerfile: persistence_app/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      snapshot_app:
        condition: service_healthy
    environment:
      TZ: "Asia/Kolkata"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: "${MONGO_DB:-trading_ai}"
      MONGO_COLL_SNAPSHOTS: "${MONGO_COLL_SNAPSHOTS:-phase1_market_snapshots}"
      MARKET_SESSION_ENABLED: "${MARKET_SESSION_ENABLED:-1}"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-Asia/Kolkata}"
      MARKET_OPEN_TIME: "${MARKET_OPEN_TIME:-09:15}"
      MARKET_CLOSE_TIME: "${MARKET_CLOSE_TIME:-15:30}"
      NSE_HOLIDAYS_FILE: "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}"
      LIVE_TOPIC: "${LIVE_TOPIC:-market:snapshot:v1}"
      HISTORICAL_TOPIC: "${HISTORICAL_TOPIC:-market:snapshot:v1:historical}"
      SNAPSHOT_V1_TOPIC: "${LIVE_TOPIC:-market:snapshot:v1}"
    command:
      [
        "python",
        "-m",
        "persistence_app.main_snapshot_consumer",
        "--foreground",
        "--event-topic",
        "${LIVE_TOPIC:-market:snapshot:v1}",
      ]
    volumes:
      - ./.run:/app/.run
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "persistence_app.health",
          "--max-age-seconds",
          "300",
        ]
      interval: 20s
      timeout: 5s
      retries: 5

  strategy_persistence_app:
    build:
      context: .
      dockerfile: persistence_app/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      strategy_app:
        condition: service_started
    environment:
      TZ: "Asia/Kolkata"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: "${MONGO_DB:-trading_ai}"
      STRATEGY_VOTE_TOPIC: "${STRATEGY_VOTE_TOPIC:-market:strategy:votes:v1}"
      TRADE_SIGNAL_TOPIC: "${TRADE_SIGNAL_TOPIC:-market:strategy:signals:v1}"
      STRATEGY_POSITION_TOPIC: "${STRATEGY_POSITION_TOPIC:-market:strategy:positions:v1}"
      STRATEGY_DECISION_TRACE_TOPIC: "${STRATEGY_DECISION_TRACE_TOPIC:-market:strategy:decision_trace:v1}"
      MONGO_COLL_STRATEGY_VOTES: "${MONGO_COLL_STRATEGY_VOTES:-strategy_votes}"
      MONGO_COLL_TRADE_SIGNALS: "${MONGO_COLL_TRADE_SIGNALS:-trade_signals}"
      MONGO_COLL_STRATEGY_POSITIONS: "${MONGO_COLL_STRATEGY_POSITIONS:-strategy_positions}"
      MONGO_COLL_STRATEGY_DECISION_TRACES: "${MONGO_COLL_STRATEGY_DECISION_TRACES:-strategy_decision_traces}"
      MARKET_SESSION_ENABLED: "${MARKET_SESSION_ENABLED:-1}"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-Asia/Kolkata}"
      MARKET_OPEN_TIME: "${MARKET_OPEN_TIME:-09:15}"
      MARKET_CLOSE_TIME: "${MARKET_CLOSE_TIME:-15:30}"
      NSE_HOLIDAYS_FILE: "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}"
    command:
      [
        "python",
        "-m",
        "persistence_app.main_strategy_consumer",
        "--foreground",
        "--vote-topic",
        "${STRATEGY_VOTE_TOPIC:-market:strategy:votes:v1}",
        "--signal-topic",
        "${TRADE_SIGNAL_TOPIC:-market:strategy:signals:v1}",
        "--position-topic",
        "${STRATEGY_POSITION_TOPIC:-market:strategy:positions:v1}",
        "--trace-topic",
        "${STRATEGY_DECISION_TRACE_TOPIC:-market:strategy:decision_trace:v1}",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "persistence_app.strategy_health",
          "--max-age-seconds",
          "300",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
    volumes:
      - ./.run:/app/.run
      - ./.data/ml_pipeline:/app/.data/ml_pipeline:ro
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro

  strategy_app:
    build:
      context: .
      dockerfile: strategy_app/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      snapshot_app:
        condition: service_healthy
    environment:
      TZ: "Asia/Kolkata"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      STRATEGY_RUN_DIR: "/app/.run/strategy_app"
      MARKET_SESSION_ENABLED: "${MARKET_SESSION_ENABLED:-1}"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-Asia/Kolkata}"
      MARKET_OPEN_TIME: "${MARKET_OPEN_TIME:-09:15}"
      MARKET_CLOSE_TIME: "${MARKET_CLOSE_TIME:-15:30}"
      NSE_HOLIDAYS_FILE: "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}"
      STRATEGY_REDIS_PUBLISH_ENABLED: "${STRATEGY_REDIS_PUBLISH_ENABLED:-1}"
      STRATEGY_VOTE_TOPIC: "${STRATEGY_VOTE_TOPIC:-market:strategy:votes:v1}"
      TRADE_SIGNAL_TOPIC: "${TRADE_SIGNAL_TOPIC:-market:strategy:signals:v1}"
      STRATEGY_POSITION_TOPIC: "${STRATEGY_POSITION_TOPIC:-market:strategy:positions:v1}"
      STRATEGY_DECISION_TRACE_TOPIC: "${STRATEGY_DECISION_TRACE_TOPIC:-market:strategy:decision_trace:v1}"
      LIVE_TOPIC: "${LIVE_TOPIC:-market:snapshot:v1}"
      HISTORICAL_TOPIC: "${HISTORICAL_TOPIC:-market:snapshot:v1:historical}"
      SNAPSHOT_V1_TOPIC: "${LIVE_TOPIC:-market:snapshot:v1}"
      ML_PIPELINE_2_REPO_ROOT: "/app"
      ML_PURE_RUN_ID: "${ML_PURE_RUN_ID:-}"
      ML_PURE_MODEL_GROUP: "${ML_PURE_MODEL_GROUP:-}"
      ML_PURE_MODEL_PACKAGE: "${ML_PURE_MODEL_PACKAGE:-}"
      ML_PURE_THRESHOLD_REPORT: "${ML_PURE_THRESHOLD_REPORT:-}"
      STRATEGY_ML_PURE_BYPASS_GATES: "${STRATEGY_ML_PURE_BYPASS_GATES:-0}"
      STRATEGY_ML_PURE_RANDOMIZE_DIRECTION: "${STRATEGY_ML_PURE_RANDOMIZE_DIRECTION:-0}"
      STRATEGY_SMART_STRIKE_ENABLED: "${STRATEGY_SMART_STRIKE_ENABLED:-0}"
      SMART_STRIKE_MAX_PREMIUM: "${SMART_STRIKE_MAX_PREMIUM:-0}"
      # Premium floor (BN only): June-2026 A/B — floor 100 re-picks strikes at
      # >=Rs100 premium (never blocks a signal). Month gross +Rs1,972 -> +Rs3,192
      # per lot, worst day -Rs1,675 -> -Rs490. Kills sub-Rs30 lottery tickets
      # where spread+brokerage ate 8-10% before the trade moved.
      SMART_STRIKE_MIN_PREMIUM: "${BN_SMART_STRIKE_MIN_PREMIUM:-100}"
      SMART_STRIKE_IV_REJECT_PCTILE: "${SMART_STRIKE_IV_REJECT_PCTILE:-}"
      SMART_STRIKE_OTM_CONFIDENCE: "${SMART_STRIKE_OTM_CONFIDENCE:-}"
      SMART_STRIKE_OTM_IV_CEIL: "${SMART_STRIKE_OTM_IV_CEIL:-}"
      SMART_STRIKE_OTM2_ENABLED: "${SMART_STRIKE_OTM2_ENABLED:-0}"
      SMART_STRIKE_OTM2_CONFIDENCE: "${SMART_STRIKE_OTM2_CONFIDENCE:-}"
      SMART_STRIKE_OTM2_IV_CEIL: "${SMART_STRIKE_OTM2_IV_CEIL:-}"
      SMART_STRIKE_OTM2_REGIMES: "${SMART_STRIKE_OTM2_REGIMES:-}"
      SMART_STRIKE_OTM2_MAX_BAR_HOUR: "${SMART_STRIKE_OTM2_MAX_BAR_HOUR:-}"
      SMART_STRIKE_OTM2_MIN_OI: "${SMART_STRIKE_OTM2_MIN_OI:-}"
      SMART_STRIKE_OTM3_ENABLED: "${SMART_STRIKE_OTM3_ENABLED:-0}"
      SMART_STRIKE_OTM3_CONFIDENCE: "${SMART_STRIKE_OTM3_CONFIDENCE:-}"
      SMART_STRIKE_OTM3_IV_CEIL: "${SMART_STRIKE_OTM3_IV_CEIL:-}"
      SMART_STRIKE_OTM3_REGIMES: "${SMART_STRIKE_OTM3_REGIMES:-}"
      SMART_STRIKE_OTM3_MAX_BAR_HOUR: "${SMART_STRIKE_OTM3_MAX_BAR_HOUR:-}"
      SMART_STRIKE_OTM3_MIN_OI: "${SMART_STRIKE_OTM3_MIN_OI:-}"
      SMART_STRIKE_OTM4_ENABLED: "${SMART_STRIKE_OTM4_ENABLED:-0}"
      SMART_STRIKE_OTM4_CONFIDENCE: "${SMART_STRIKE_OTM4_CONFIDENCE:-}"
      SMART_STRIKE_OTM4_IV_CEIL: "${SMART_STRIKE_OTM4_IV_CEIL:-}"
      SMART_STRIKE_OTM4_REGIMES: "${SMART_STRIKE_OTM4_REGIMES:-}"
      SMART_STRIKE_OTM4_MAX_BAR_HOUR: "${SMART_STRIKE_OTM4_MAX_BAR_HOUR:-}"
      SMART_STRIKE_OTM4_MIN_OI: "${SMART_STRIKE_OTM4_MIN_OI:-}"
      ML_PURE_UNDERLYING_STOP_PCT: "${ML_PURE_UNDERLYING_STOP_PCT:-}"
      ML_PURE_UNDERLYING_TARGET_PCT: "${ML_PURE_UNDERLYING_TARGET_PCT:-}"
      ML_PURE_POST_STOP_COOLDOWN_BARS: "${ML_PURE_POST_STOP_COOLDOWN_BARS:-0}"
      OPTION_PNL_MODEL_BUNDLE: "${OPTION_PNL_MODEL_BUNDLE:-/app/ml_pipeline_2/artifacts/option_pnl_bundles/option_pnl_atm_pe_9_20260518_063221/option_pnl_atm_pe_9_20260518_063304,/app/ml_pipeline_2/artifacts/option_pnl_bundles/option_pnl_atm_ce_9_20260518_063305/option_pnl_atm_ce_9_20260518_063335}"
      OPTION_PNL_RISK_BREACH_COOLDOWN_BARS: "${OPTION_PNL_RISK_BREACH_COOLDOWN_BARS:-5}"
      ML_PURE_MAX_FEATURE_AGE_SEC: "${ML_PURE_MAX_FEATURE_AGE_SEC:-90}"
      STRATEGY_ENHANCED_VELOCITY: "${STRATEGY_ENHANCED_VELOCITY:-0}"
      STRATEGY_IV_EXTREME_PERCENTILE: "${STRATEGY_IV_EXTREME_PERCENTILE:-95.0}"
      RISK_PROFILE: "${RISK_PROFILE:-}"
      RISK_LOT_SIZING_MODE: "${RISK_LOT_SIZING_MODE:-risk_based}"
      RISK_NOTIONAL_PER_TRADE: "${RISK_NOTIONAL_PER_TRADE:-0}"
      RISK_LOT_BUDGET_USES_LOT_SIZE: "${RISK_LOT_BUDGET_USES_LOT_SIZE:-1}"
      RISK_MAX_DAILY_LOSS_PCT: "${RISK_MAX_DAILY_LOSS_PCT:-0.02}"
      RISK_MAX_CONSECUTIVE_LOSSES: "${RISK_MAX_CONSECUTIVE_LOSSES:-3}"
      RISK_MAX_SESSION_TRADES: "${RISK_MAX_SESSION_TRADES:-6}"
      RISK_MAX_LOTS_PER_TRADE: "${RISK_MAX_LOTS_PER_TRADE:-5}"
      RISK_PER_TRADE_PCT: "${RISK_PER_TRADE_PCT:-0.005}"
      RISK_CAPITAL_ALLOCATED: "${RISK_CAPITAL_ALLOCATED:-500000}"
      BANKNIFTY_LOT_SIZE: "${BANKNIFTY_LOT_SIZE:-15}"
      RISK_VIX_HALT_THRESHOLD: "${RISK_VIX_HALT_THRESHOLD:-15}"
      RISK_VIX_RESUME_THRESHOLD: "${RISK_VIX_RESUME_THRESHOLD:-8}"
      STRATEGY_STARTUP_WARMUP_MINUTES: "${STRATEGY_STARTUP_WARMUP_MINUTES:-0}"
      STRATEGY_STARTUP_WARMUP_EVENTS: "${STRATEGY_STARTUP_WARMUP_EVENTS:-0}"
      STRATEGY_STRIKE_SELECTION_POLICY: "${STRATEGY_STRIKE_SELECTION_POLICY:-atm}"
      STRATEGY_STRIKE_MAX_OTM_STEPS: "${STRATEGY_STRIKE_MAX_OTM_STEPS:-2}"
      STRATEGY_STRIKE_MIN_OI: "${STRATEGY_STRIKE_MIN_OI:-50000}"
      STRATEGY_STRIKE_MIN_VOLUME: "${STRATEGY_STRIKE_MIN_VOLUME:-15000}"
      STRATEGY_STRIKE_LIQUIDITY_WEIGHT: "${STRATEGY_STRIKE_LIQUIDITY_WEIGHT:-1.0}"
      STRATEGY_STRIKE_AFFORDABILITY_WEIGHT: "${STRATEGY_STRIKE_AFFORDABILITY_WEIGHT:-0.25}"
      STRATEGY_STRIKE_DISTANCE_PENALTY: "${STRATEGY_STRIKE_DISTANCE_PENALTY:-0.05}"
      STRATEGY_PROFILE_ID: "${STRATEGY_PROFILE_ID:-}"
      STRATEGY_PREMIUM_STOP_LOSS_PCT: "${STRATEGY_PREMIUM_STOP_LOSS_PCT:-}"
      ENTRY_ML_MODEL_PATH: "${ENTRY_ML_MODEL_PATH:-}"
      ENTRY_ML_MIN_PROB: "${ENTRY_ML_MIN_PROB:-0.55}"
      # Fast-onset model v1 (2026-07-08): 1-15min features, OR-combined with v3.
      # Catches fast expansions v3's 30-60m windows lag. June calib: threshold 0.6
      # -> silent on 11 normal days (3 bars, all on the one other volatile day),
      # fires 93 bars through the 2026-07-08 90-min crash (peak p=1.0). BN's higher
      # base rate (20% vs NIFTY 1.3%) needed a much higher threshold than NIFTY's 0.08.
      ENTRY_ML_MODEL_PATH_2: "${ENTRY_ML_MODEL_PATH_2:-/app/models/dhan_entry_fast_v1.joblib}"
      ENTRY_ML_MIN_PROB_2: "${ENTRY_ML_MIN_PROB_2:-0.6}"
      ENTRY_ML_MAX_NAN_FEATURES: "${ENTRY_ML_MAX_NAN_FEATURES:-}"
      ENTRY_ALLOW_CHOP: "${ENTRY_ALLOW_CHOP:-}"
      ENTRY_BLOCK_PRE_EXPIRY: "${ENTRY_BLOCK_PRE_EXPIRY:-}"
      ENTRY_VOL_GATE_ENABLED: "${ENTRY_VOL_GATE_ENABLED:-0}"
      ATR_ENTRY_MIN_PCT: "${ATR_ENTRY_MIN_PCT:-0.00088}"
      ATR_ENTRY_MIN_ABS: "${ATR_ENTRY_MIN_ABS:-0}"
      ATR_ENTRY_BB_MIN: "${ATR_ENTRY_BB_MIN:-0}"
      ML_ENTRY_PE_ONLY: "${ML_ENTRY_PE_ONLY:-0}"
      ML_ENTRY_BLOCK_CE: "${ML_ENTRY_BLOCK_CE:-0}"
      ML_ENTRY_CE_ONLY: "${ML_ENTRY_CE_ONLY:-0}"
      ML_ENTRY_BLOCK_PE: "${ML_ENTRY_BLOCK_PE:-0}"
      ENTRY_WINDOW_START_IST: "${ENTRY_WINDOW_START_IST:-}"
      ENTRY_WINDOW_END_IST: "${ENTRY_WINDOW_END_IST:-}"
      ENTRY_TIME_WINDOWS: "${ENTRY_TIME_WINDOWS:-}"
      ENTRY_REGIME_TAGGER: "${ENTRY_REGIME_TAGGER:-}"
      ENTRY_REGIME_ALLOWED_TAGS: "${ENTRY_REGIME_ALLOWED_TAGS:-}"
      DIRECTION_ML_MODEL_PATH: "${DIRECTION_ML_MODEL_PATH:-}"
      DIRECTION_ML_MIN_MARGIN: "${DIRECTION_ML_MIN_MARGIN:-0}"
      DIRECTION_ML_WEIGHT: "${DIRECTION_ML_WEIGHT:-0.40}"
      DIRECTION_ML_MAX_NAN_FEATURES: "${DIRECTION_ML_MAX_NAN_FEATURES:-10}"
      ML_ENTRY_DIRECTION_MODE: "${ML_ENTRY_DIRECTION_MODE:-direction_ml}"
      REGIME_GUARD_MAX_ORW: "${REGIME_GUARD_MAX_ORW:-}"
      DIRECTION_ML_CONFIDENCE_MIN: "${DIRECTION_ML_CONFIDENCE_MIN:-}"
      ENTRY_DIR_W_ML: "${ENTRY_DIR_W_ML:-0.20}"
      DIRECTION_ML_FILTER_MIN_PROB: "${DIRECTION_ML_FILTER_MIN_PROB:-}"
      BRAIN_ENABLED: "${BRAIN_ENABLED:-true}"
      BRAIN_DAILY_FEATURES_PATH: "${BRAIN_DAILY_FEATURES_PATH:-/app/.data/ml_pipeline/daily_regime_features.json}"
      BRAIN_CONSENSUS_MIN_AGREEING: "${BRAIN_CONSENSUS_MIN_AGREEING:-1}"
      BRAIN_CONSENSUS_REQUIRE_DIRECTION: "${BRAIN_CONSENSUS_REQUIRE_DIRECTION:-false}"
      ML_ENTRY_DET_SKIP_BRAIN_GATE: "${ML_ENTRY_DET_SKIP_BRAIN_GATE:-false}"
      # 2026-07-22: flipped default 0 -> 1. BankNifty's real decision (direction_ml)
      # still never consults depth -- its trained model has zero depth features
      # (confirmed against the actual bundle). This only feeds the new
      # composite_depth_shadow observation in deterministic_rule_engine.py,
      # which needs get_depth_context() to return real data to be worth anything.
      DEPTH_FEED_ENABLED: "${DEPTH_FEED_ENABLED:-1}"
      DEPTH_STALE_SEC: "${DEPTH_STALE_SEC:-30}"

      # ── Exit policy stack (E2) ─────────────────────────────────────────────
      # Master switch — set to 1 to activate. Default 0 preserves existing behaviour.
      EXIT_POLICY_STACK_ENABLED: "${EXIT_POLICY_STACK_ENABLED:-0}"
      EXIT_PREMIUM_TARGET_PCT: "${EXIT_PREMIUM_TARGET_PCT:-0.015}"
      EXIT_TRAILING_ACTIVATION_PCT: "${EXIT_TRAILING_ACTIVATION_PCT:-0.01}"
      EXIT_TRAILING_TRAIL_PCT: "${EXIT_TRAILING_TRAIL_PCT:-0.005}"
      EXIT_THESIS_FAIL_BARS: "${EXIT_THESIS_FAIL_BARS:-3}"
      EXIT_THESIS_FAIL_MIN_MFE: "${EXIT_THESIS_FAIL_MIN_MFE:-0.002}"
      # Scalper sub-stack hard loss cap (makes adaptive self-sufficient; >=1.0 disables)
      EXIT_SCALPER_HARD_STOP_PCT: "${EXIT_SCALPER_HARD_STOP_PCT:-0.25}"
      # Model-horizon timestop: entry model predicts a move within 15 min; exit
      # losing/flat positions once that window expires (June A/B: NIFTY Jun-24
      # -18.8% -> -10.6%, BN book unchanged). 0 = off.
      EXIT_SCALPER_STALE_BARS: "${EXIT_SCALPER_STALE_BARS:-15}"
      # Trade alerts (BUY/close/halt) fire from signal_logger INSIDE this container —
      # without these vars alert_open silently no-ops (found 2026-07-08: first live
      # trade produced no Telegram message).
      ALERT_ENABLED: "${ALERT_ENABLED:-0}"
      ALERT_TELEGRAM_TOKEN: "${ALERT_TELEGRAM_TOKEN:-}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-}"
      # PANIC regime tuning — REQUIRE_NONDIRECTIONAL suppresses PANIC on cleanly
      # directional moves (aligned 5/15/30m) so a crash is tradeable as a trend.
      # Was in .env.compose but never passed (found 2026-07-08: the -336pt NIFTY
      # fall was PANIC-blocked for its entire entry window).
      REGIME_PANIC_REQUIRE_NONDIRECTIONAL: "${REGIME_PANIC_REQUIRE_NONDIRECTIONAL:-1}"
      REGIME_PANIC_VIX_CHG_MIN: "${REGIME_PANIC_VIX_CHG_MIN:-5.0}"
      REGIME_PANIC_RVOL_MIN: "${REGIME_PANIC_RVOL_MIN:-0.012}"
      # Giveback stop (Jun-4 dead-zone fix): off by default; enable with EXIT_GIVEBACK_STOP_ENABLED=1
      EXIT_GIVEBACK_STOP_ENABLED: "${EXIT_GIVEBACK_STOP_ENABLED:-0}"
      EXIT_GIVEBACK_MIN_MFE: "${EXIT_GIVEBACK_MIN_MFE:-0.03}"
      EXIT_GIVEBACK_PCT: "${EXIT_GIVEBACK_PCT:-0.09}"
      LOTTERY_GIVEBACK_PCT: "${LOTTERY_GIVEBACK_PCT:-0.15}"
      LOTTERY_GIVEBACK_TIERED: "${LOTTERY_GIVEBACK_TIERED:-0}"
      LOTTERY_GIVEBACK_TIER1_PCT: "${LOTTERY_GIVEBACK_TIER1_PCT:-0.02}"
      LOTTERY_GIVEBACK_TIER2_PCT: "${LOTTERY_GIVEBACK_TIER2_PCT:-0.05}"
      LOTTERY_GIVEBACK_TIER2_MFE: "${LOTTERY_GIVEBACK_TIER2_MFE:-0.10}"
      LOTTERY_GIVEBACK_TIER3_MFE: "${LOTTERY_GIVEBACK_TIER3_MFE:-0.20}"
      LOTTERY_MOMENTUM_FLIP_MIN_BARS: "${LOTTERY_MOMENTUM_FLIP_MIN_BARS:-0}"
      LOTTERY_MOMENTUM_FLIP_MODE: "${LOTTERY_MOMENTUM_FLIP_MODE:-absolute}"
      LOTTERY_MOMENTUM_FLIP_DELTA: "${LOTTERY_MOMENTUM_FLIP_DELTA:-2.0}"
      REGIME_SHIFT_MIN_HOLD_BARS: "${REGIME_SHIFT_MIN_HOLD_BARS:-0}"
      REGIME_SHIFT_MIN_HOLD_SCOPE: "${REGIME_SHIFT_MIN_HOLD_SCOPE:-all}"
      ENTRY_COUNTERTREND_VETO: "${ENTRY_COUNTERTREND_VETO:-0}"

      EXIT_MAX_LOSS_PCT: "${EXIT_MAX_LOSS_PCT:-0.10}"

      # ── Near-expiry exit override (tighter stack at low DTE; off by default) ─
      EXIT_EXPIRY_OVERRIDE_ENABLED: "${EXIT_EXPIRY_OVERRIDE_ENABLED:-0}"
      EXIT_EXPIRY_DTE_THRESHOLD: "${EXIT_EXPIRY_DTE_THRESHOLD:-0}"
      EXIT_EXPIRY_HARD_STOP_PCT: "${EXIT_EXPIRY_HARD_STOP_PCT:-0.15}"
      EXIT_EXPIRY_THESIS_FAIL_BARS: "${EXIT_EXPIRY_THESIS_FAIL_BARS:-3}"
      EXIT_EXPIRY_THESIS_FAIL_MIN_MFE: "${EXIT_EXPIRY_THESIS_FAIL_MIN_MFE:-0.02}"
      EXIT_EXPIRY_TRAIL_ACTIVATION_PCT: "${EXIT_EXPIRY_TRAIL_ACTIVATION_PCT:-0.03}"
      EXIT_EXPIRY_TRAIL_PCT: "${EXIT_EXPIRY_TRAIL_PCT:-0.015}"
      EXIT_EXPIRY_PREMIUM_TARGET_PCT: "${EXIT_EXPIRY_PREMIUM_TARGET_PCT:-0.10}"

      # ── Entry gate (E3) ───────────────────────────────────────────────────
      # Align consensus bypass threshold to entry gate. Default 0.65 = same as STRATEGY_MIN_CONFIDENCE.
      CONSENSUS_BYPASS_MIN_CONFIDENCE: "${CONSENSUS_BYPASS_MIN_CONFIDENCE:-0.65}"
      # SIDEWAYS regime requires higher direction margin (noisier signals in flat market).
      DIRECTION_MIN_MARGIN_SIDEWAYS: "${DIRECTION_MIN_MARGIN_SIDEWAYS:-2.0}"

      # ── Entry quality grade + live/paper tiering (E9) ─────────────────────
      # Observational: NEVER blocks. Paper takes every trade; the tier labels the
      # subset that WOULD fire on real money (live_would_take). See entry_quality.py.
      ENTRY_TIERING_ENABLED: "${ENTRY_TIERING_ENABLED:-true}"
      # Depth de-correlation: collapse correlated order-book ticks into one capped
      # net vote (root-cause fix for the 2026-06-03 fce59da2 CE miss). 0 = legacy sum.
      ENTRY_DIR_DEPTH_DECORRELATE: "${ENTRY_DIR_DEPTH_DECORRELATE:-1}"
      ENTRY_DIR_DEPTH_NET_CAP: "${ENTRY_DIR_DEPTH_NET_CAP:-1.1}"
      # Grade thresholds (score starts 1.0, penalties subtract; GOOD>=good_at, BAD<bad_below).
      ENTRY_QUALITY_GOOD_AT: "${ENTRY_QUALITY_GOOD_AT:-0.8}"
      ENTRY_QUALITY_BAD_BELOW: "${ENTRY_QUALITY_BAD_BELOW:-0.5}"
      ENTRY_QUALITY_MARGIN_GOOD: "${ENTRY_QUALITY_MARGIN_GOOD:-2.0}"
      ENTRY_QUALITY_MARGIN_WEAK: "${ENTRY_QUALITY_MARGIN_WEAK:-1.0}"
      ENTRY_QUALITY_MAX_DEPTH_SHARE: "${ENTRY_QUALITY_MAX_DEPTH_SHARE:-0.6}"
      ENTRY_QUALITY_CHOP_REGIMES: "${ENTRY_QUALITY_CHOP_REGIMES:-SIDEWAYS,CHOP,UNKNOWN}"
      ENTRY_QUALITY_IV_SKEW_BAND: "${ENTRY_QUALITY_IV_SKEW_BAND:-0.08}"
      ENTRY_QUALITY_PEN_MARGIN_THIN: "${ENTRY_QUALITY_PEN_MARGIN_THIN:-0.5}"
      ENTRY_QUALITY_PEN_MARGIN_MILD: "${ENTRY_QUALITY_PEN_MARGIN_MILD:-0.2}"
      ENTRY_QUALITY_PEN_DEPTH_DOM: "${ENTRY_QUALITY_PEN_DEPTH_DOM:-0.3}"
      ENTRY_QUALITY_PEN_CHOP_REGIME: "${ENTRY_QUALITY_PEN_CHOP_REGIME:-0.3}"
      ENTRY_QUALITY_PEN_STALE_MOMENTUM: "${ENTRY_QUALITY_PEN_STALE_MOMENTUM:-0.3}"
      ENTRY_QUALITY_PEN_IV_DISAGREE: "${ENTRY_QUALITY_PEN_IV_DISAGREE:-0.2}"
      # RiskManager live-eligibility: grade floor + recent (session) performance gate.
      RISK_LIVE_MIN_GRADE: "${RISK_LIVE_MIN_GRADE:-GOOD}"
      RISK_LIVE_MIN_WINRATE: "${RISK_LIVE_MIN_WINRATE:-0.0}"
      RISK_LIVE_WINRATE_MIN_TRADES: "${RISK_LIVE_WINRATE_MIN_TRADES:-5}"

      # ── Risk sizing (E4) ──────────────────────────────────────────────────
      # RISK_CALCULATOR=fixed_fraction uses 1% of capital at risk per trade.
      RISK_CALCULATOR: "${RISK_CALCULATOR:-fixed_fraction}"
      RISK_FRACTION_PCT: "${RISK_FRACTION_PCT:-0.01}"

      # ── Exit strategy mode ────────────────────────────────────────────────
      EXIT_STRATEGY_MODE: "${EXIT_STRATEGY_MODE:-scalper}"
      ADAPTIVE_LOTTERY_REGIMES: "${ADAPTIVE_LOTTERY_REGIMES:-BREAKOUT,TRENDING}"
      # ── Trend-aware regime + trend-fade guard (2026-06-04 postmortem) ──────
      REGIME_TREND_ALIGNED_BONUS: "${REGIME_TREND_ALIGNED_BONUS:-0.0}"
      REGIME_TREND_SCORE_MIN: "${REGIME_TREND_SCORE_MIN:-2.0}"
      TREND_FADE_GUARD_ENABLED: "${TREND_FADE_GUARD_ENABLED:-false}"
      TREND_FADE_GUARD_VWAP_MIN: "${TREND_FADE_GUARD_VWAP_MIN:-0.001}"
      TREND_FADE_GUARD_R30M_STRONG: "${TREND_FADE_GUARD_R30M_STRONG:-0.005}"
      LOTTERY_HARD_STOP_PCT: "${LOTTERY_HARD_STOP_PCT:-0.20}"
      LOTTERY_BIG_TARGET_PCT: "${LOTTERY_BIG_TARGET_PCT:-0.50}"
      LOTTERY_RUNNER_ACTIVATION_MFE: "${LOTTERY_RUNNER_ACTIVATION_MFE:-0.20}"
      LOTTERY_RUNNER_GIVEBACK_FRAC: "${LOTTERY_RUNNER_GIVEBACK_FRAC:-0.35}"
      LOTTERY_THESIS_FAIL_BARS: "${LOTTERY_THESIS_FAIL_BARS:-5}"
      LOTTERY_THESIS_FAIL_MIN_MFE: "${LOTTERY_THESIS_FAIL_MIN_MFE:-0.03}"
      LOTTERY_TIMESTOP_BARS: "${LOTTERY_TIMESTOP_BARS:-90}"
      LOTTERY_MOMENTUM_FLIP: "${LOTTERY_MOMENTUM_FLIP:-1.0}"

      STRATEGY_MIN_CONFIDENCE: "${STRATEGY_MIN_CONFIDENCE:-0.65}"
    command:
      [
        "python",
        "-m",
        "strategy_app.main",
        "--engine",
        "${STRATEGY_ENGINE:-deterministic}",
        "--min-confidence",
        "${STRATEGY_MIN_CONFIDENCE:-0.65}",
        "--strategy-profile-id",
        "${STRATEGY_PROFILE_ID:-}",
        "--topic",
        "${LIVE_TOPIC:-market:snapshot:v1}",
        "--rollout-stage",
        "${STRATEGY_ROLLOUT_STAGE:-capped_live}",
        "--position-size-multiplier",
        "${STRATEGY_POSITION_SIZE_MULTIPLIER:-1.0}",
        "--ml-runtime-guard-file",
        "${STRATEGY_ML_RUNTIME_GUARD_FILE:-}",
        "--ml-pure-run-id",
        "${ML_PURE_RUN_ID:-}",
        "--ml-pure-model-group",
        "${ML_PURE_MODEL_GROUP:-}",
        "--ml-pure-model-package",
        "${ML_PURE_MODEL_PACKAGE:-}",
        "--ml-pure-threshold-report",
        "${ML_PURE_THRESHOLD_REPORT:-}",
      ]
    volumes:
      - ./.run:/app/.run
      - ./.data/ml_pipeline:/app/.data/ml_pipeline:ro
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro
      - ./ml_pipeline_2/artifacts:/app/ml_pipeline_2/artifacts:ro
      - ./ops/strategy_config.yml:/app/ops/strategy_config.yml:ro
    healthcheck:
      test: ["CMD", "python", "-m", "strategy_app.health"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────
  # EXECUTION APP
  # Routes strategy trade signals to the configured broker adapter.
  # EXECUTION_ADAPTER=paper  → no real orders (safe default)
  # EXECUTION_ADAPTER=kite   → real Kite NFO orders (requires credentials)
  # EXECUTION_ADAPTER=dhan   → real Dhan NFO orders (requires DHAN_CLIENT_ID + DHAN_ACCESS_TOKEN)
  # Enable by adding --profile live to docker compose up, or run individually.
  # ─────────────────────────────────────────────────────────────────────────
  execution_app:
    profiles: ["live"]
    build:
      context: .
      dockerfile: execution_app/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      strategy_app:
        condition: service_started
    environment:
      TZ: "Asia/Kolkata"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: "${MONGO_DB:-trading_ai}"

      # ── Adapter selection ──────────────────────────────────────────────────
      EXECUTION_ADAPTER: "${EXECUTION_ADAPTER:-paper}"
      # Paper/live safety gate: when 1 (default) only tier=="live" signals reach the
      # broker; paper-tier signals are skipped (fail-closed). Set 0 for full-live.
      # Restored to fail-closed 2026-07-14: the 2026-07-01 hardcode to "0" (5ff8f13)
      # over-corrected a RISK_LIVE_MIN_GRADE inheritance bug on the NIFTY side by
      # also disabling this gate on BankNifty, where the grade default (GOOD, line
      # ~502) was never broken — verified 0 open positions before restoring, see
      # project_execution_tier_gate_2026-07-14 memory.
      EXECUTION_REQUIRE_LIVE_TIER: "${EXECUTION_REQUIRE_LIVE_TIER:-1}"

      # ── Kite credentials (required when EXECUTION_ADAPTER=kite) ───────────
      KITE_API_KEY: "${KITE_API_KEY:-}"
      KITE_ACCESS_TOKEN: "${KITE_ACCESS_TOKEN:-}"

      # ── Dhan credentials (required when EXECUTION_ADAPTER=dhan) ───────────
      DHAN_CLIENT_ID: "${DHAN_CLIENT_ID:-}"
      DHAN_ACCESS_TOKEN: "${DHAN_ACCESS_TOKEN:-}"
      DHAN_PRODUCT_TYPE: "${DHAN_PRODUCT_TYPE:-MARGIN}"
      BANKNIFTY_LOT_SIZE: "${BANKNIFTY_LOT_SIZE:-15}"

      # ── Order management ──────────────────────────────────────────────────
      ORDER_FILL_TIMEOUT_SEC: "${ORDER_FILL_TIMEOUT_SEC:-30}"
      ORDER_POLL_INTERVAL_SEC: "${ORDER_POLL_INTERVAL_SEC:-1}"
      # Broker-side disaster stop: resting SL SELL armed at the exchange right
      # after each entry fill (protects positions when the stack is down between
      # 1-min bars / token outages). DEFAULT OFF — 2026-07-09 live incident: Dhan
      # converted STOP_LOSS_MARKET to an immediate LIMIT sell (trigger dropped),
      # flattening the position instantly. Re-enable only after the order type is
      # proven to rest at the broker.
      EXEC_BROKER_STOP_ENABLED: "${EXEC_BROKER_STOP_ENABLED:-0}"
      EXEC_BROKER_STOP_PCT: "${EXEC_BROKER_STOP_PCT:-0.15}"

      # ── Fill tracking ─────────────────────────────────────────────────────
      FILL_TRACKER_ENABLED: "${FILL_TRACKER_ENABLED:-1}"
      EXECUTION_FILLS_STREAM: "${EXECUTION_FILLS_STREAM:-execution:fills:v1}"
      MONGO_COLL_EXECUTION_FILLS: "${MONGO_COLL_EXECUTION_FILLS:-execution_fills}"
      MONGO_COLL_STRATEGY_POSITIONS: "${MONGO_COLL_STRATEGY_POSITIONS:-strategy_positions}"

      # ── Shadow mode ──────────────────────────────────────────────────────
      SHADOW_MAX_LOTS: "${SHADOW_MAX_LOTS:-1}"
      SHADOW_REAL_FILLS_STREAM: "${SHADOW_REAL_FILLS_STREAM:-execution:fills:real:v1}"
      SHADOW_PAPER_FILLS_STREAM: "${SHADOW_PAPER_FILLS_STREAM:-execution:fills:paper:v1}"

      # ── Alerts ────────────────────────────────────────────────────────────
      ALERT_ENABLED: "${ALERT_ENABLED:-0}"
      ALERT_TELEGRAM_TOKEN: "${ALERT_TELEGRAM_TOKEN:-}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-}"
      # PANIC regime tuning — REQUIRE_NONDIRECTIONAL suppresses PANIC on cleanly
      # directional moves (aligned 5/15/30m) so a crash is tradeable as a trend.
      # Was in .env.compose but never passed (found 2026-07-08: the -336pt NIFTY
      # fall was PANIC-blocked for its entire entry window).
      REGIME_PANIC_REQUIRE_NONDIRECTIONAL: "${REGIME_PANIC_REQUIRE_NONDIRECTIONAL:-1}"
      REGIME_PANIC_VIX_CHG_MIN: "${REGIME_PANIC_VIX_CHG_MIN:-5.0}"
      REGIME_PANIC_RVOL_MIN: "${REGIME_PANIC_RVOL_MIN:-0.012}"

      # ── Signal subscription ───────────────────────────────────────────────
      TRADE_SIGNAL_TOPIC: "${TRADE_SIGNAL_TOPIC:-market:strategy:signals:v1}"
    ports:
      - "${EXECUTION_APP_HEALTH_PORT:-8009}:8009"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

