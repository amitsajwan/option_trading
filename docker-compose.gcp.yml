    command:
      [
        "python",
        "-m",
        "strategy_app.main",
        "--engine",
        "${STRATEGY_ENGINE:-deterministic}",
        "--min-confidence",
        "${STRATEGY_MIN_CONFIDENCE:-0.65}",
        "--strategy-profile-id",
