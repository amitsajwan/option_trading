  strategy_app_nifty:
    image: option_trading-strategy_app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      snapshot_app_nifty:
        condition: service_healthy
    environment:
      TZ: "Asia/Kolkata"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      STRATEGY_INSTRUMENT: NIFTY
      STRATEGY_RUN_DIR: "/app/.run/strategy_app_nifty"
      MARKET_SESSION_ENABLED: "${MARKET_SESSION_ENABLED:-1}"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-Asia/Kolkata}"
      MARKET_OPEN_TIME: "${MARKET_OPEN_TIME:-09:15}"
      MARKET_CLOSE_TIME: "${MARKET_CLOSE_TIME:-15:30}"
      NSE_HOLIDAYS_FILE: "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}"
      LIVE_TOPIC: "market:nifty:snapshot:v1"
      SNAPSHOT_V1_TOPIC: "market:nifty:snapshot:v1"
      STRATEGY_REDIS_PUBLISH_ENABLED: "1"
      STRATEGY_VOTE_TOPIC: "market:nifty:strategy:votes:v1"
      TRADE_SIGNAL_TOPIC: "market:nifty:strategy:signals:v1"
      STRATEGY_POSITION_TOPIC: "market:nifty:strategy:positions:v1"
      STRATEGY_DECISION_TRACE_TOPIC: "market:nifty:strategy:decision_trace:v1"
      # Models — files must exist in ./models/ (mounted as /app/models:ro)
      # Override via NIFTY_ENTRY_ML_MODEL_PATH in .env.compose; defaults to the
      # committed bundle. Do NOT leave blank — strategy_app produces zero votes.
      ENTRY_ML_MODEL_PATH: "${NIFTY_ENTRY_ML_MODEL_PATH:-/app/models/nifty_entry_bundle_v2.joblib}"
      ENTRY_ML_MIN_PROB: "${NIFTY_ENTRY_ML_MIN_PROB:-0.05}"
      # Fast-onset model v1 (2026-07-08): 1-15min features, OR-combined with v3.
      # Catches fast expansions the v3 model's 30-60m windows lag (Jul-8 crash:
      # fires 13:57 vs v3 at the bottom). June calib: 7 bars/month at thr 0.08.
      ENTRY_ML_MODEL_PATH_2: "${NIFTY_ENTRY_ML_MODEL_PATH_2:-/app/models/nifty_entry_fast_v1.joblib}"
      ENTRY_ML_MIN_PROB_2: "${NIFTY_ENTRY_ML_MIN_PROB_2:-0.08}"
      DIRECTION_ML_MODEL_PATH: "${NIFTY_DIRECTION_ML_MODEL_PATH:-/app/models/nifty_direction_v2.joblib}"
      DIRECTION_ML_MIN_MARGIN: "${DIRECTION_ML_MIN_MARGIN:-0}"
      ENTRY_ML_MAX_NAN_FEATURES: "${NIFTY_ENTRY_ML_MAX_NAN_FEATURES:-2}"
      DIRECTION_ML_MAX_NAN_FEATURES: "${DIRECTION_ML_MAX_NAN_FEATURES:-10}"
      ML_ENTRY_DIRECTION_MODE: "${NIFTY_ML_ENTRY_DIRECTION_MODE:-composite}"
      # 2026-07-21: composite's depth signal (weight 1.1, heaviest) had been
      # dead for weeks -- depth_collector was Kite-only, never ported to Dhan.
      # Now live via depth_collector_dhan_nifty; STRATEGY_INSTRUMENT=NIFTY
      # (set below) namespaces the Redis keys this container reads.
      DEPTH_FEED_ENABLED: "${DEPTH_FEED_ENABLED_NIFTY:-1}"
      ENTRY_BLOCK_PRE_EXPIRY: "${ENTRY_BLOCK_PRE_EXPIRY:-}"
      # Cost gate calibration — NIFTY has smaller absolute point moves and lower
      # ATM premiums than BankNifty, making brokerage a larger % of trade value.
      # ratio_min=1.0 (vs BN 1.5) and slippage=0.005 (vs BN 0.008, NIFTY is liquid).
      ENTRY_COST_RATIO_MIN: "${NIFTY_ENTRY_COST_RATIO_MIN:-1.0}"
      ENTRY_COST_SLIPPAGE_PCT: "${NIFTY_ENTRY_COST_SLIPPAGE_PCT:-0.005}"
      # NIFTY-specific sizing — NSE changes lot size per expiry; execution uses scrip master.
      # Set NIFTY_LOT_SIZE in .env to match the current front-month (65 per Jul-2026 scrip master).
      NIFTY_LOT_SIZE: "${NIFTY_LOT_SIZE:-65}"
      STRATEGY_MIN_CONFIDENCE: "0.05"
      RISK_LIVE_MIN_GRADE: "${RISK_LIVE_MIN_GRADE:-OK}"
      RISK_MAX_LOTS_PER_TRADE: "1"
      RISK_CAPITAL_ALLOCATED: "${RISK_CAPITAL_ALLOCATED:-500000}"
      RISK_PER_TRADE_PCT: "${RISK_PER_TRADE_PCT:-0.005}"
      RISK_MAX_DAILY_LOSS_PCT: "${RISK_MAX_DAILY_LOSS_PCT:-0.02}"
      RISK_MAX_SESSION_TRADES: "6"
      RISK_MAX_CONSECUTIVE_LOSSES: "3"
      ENTRY_TIERING_ENABLED: "true"
      EXIT_STRATEGY_MODE: "${EXIT_STRATEGY_MODE:-scalper}"
      EXIT_MAX_LOSS_PCT: "${EXIT_MAX_LOSS_PCT:-0.10}"
      EXIT_SCALPER_HARD_STOP_PCT: "${EXIT_SCALPER_HARD_STOP_PCT:-0.25}"
      # Model-horizon timestop: entry model predicts a move within 15 min; exit
      # losing/flat positions once that window expires (June A/B: NIFTY Jun-24
      # -18.8% -> -10.6%, BN book unchanged). 0 = off.
      EXIT_SCALPER_STALE_BARS: "${EXIT_SCALPER_STALE_BARS:-15}"
      # Trade alerts (BUY/close/halt) fire from signal_logger INSIDE this container —
      # without these vars alert_open silently no-ops (found 2026-07-08: first live
      # trade produced no Telegram message).
      ALERT_ENABLED: "${ALERT_ENABLED:-0}"
      ALERT_TELEGRAM_TOKEN: "${ALERT_TELEGRAM_TOKEN:-}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-}"
      # PANIC regime tuning — REQUIRE_NONDIRECTIONAL suppresses PANIC on cleanly
      # directional moves (aligned 5/15/30m) so a crash is tradeable as a trend.
      # Was in .env.compose but never passed (found 2026-07-08: the -336pt NIFTY
      # fall was PANIC-blocked for its entire entry window).
      REGIME_PANIC_REQUIRE_NONDIRECTIONAL: "${REGIME_PANIC_REQUIRE_NONDIRECTIONAL:-1}"
      REGIME_PANIC_VIX_CHG_MIN: "${REGIME_PANIC_VIX_CHG_MIN:-5.0}"
      REGIME_PANIC_RVOL_MIN: "${REGIME_PANIC_RVOL_MIN:-0.012}"
      # Explicit (code defaults true): contract check flagged NIFTY riding the
      # implicit default while BN pins it — pin both so intent is visible.
      EXIT_POLICY_STACK_ENABLED: "${EXIT_POLICY_STACK_ENABLED:-1}"
      # Giveback stop (Jun-4 dead-zone fix): exits trades whose MFE showed promise
      # (>=3%) but then gave back 9% from peak — the July-1 -14% all-day hold gap.
      EXIT_GIVEBACK_STOP_ENABLED: "${EXIT_GIVEBACK_STOP_ENABLED:-0}"
      EXIT_GIVEBACK_MIN_MFE: "${EXIT_GIVEBACK_MIN_MFE:-0.03}"
      EXIT_GIVEBACK_PCT: "${EXIT_GIVEBACK_PCT:-0.09}"
      STRATEGY_PROFILE_ID: "${STRATEGY_PROFILE_ID:-trader_master_ml_entry_v1}"
    command:
      - "python"
      - "-m"
      - "strategy_app.main"
      - "--engine"
      - "deterministic"
      - "--min-confidence"
      - "0.05"
      - "--strategy-profile-id"
      - "${STRATEGY_PROFILE_ID:-trader_master_ml_entry_v1}"
      - "--topic"
      - "market:nifty:snapshot:v1"
      - "--rollout-stage"
      - "capped_live"
      - "--position-size-multiplier"
      - "0.25"
    volumes:
      - ./.run:/app/.run
      - ./.data/ml_pipeline:/app/.data/ml_pipeline:ro
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro
      - ./ml_pipeline_2/artifacts:/app/ml_pipeline_2/artifacts:ro
      - ./ops/strategy_config.yml:/app/ops/strategy_config.yml:ro
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-m", "strategy_app.health"]
      interval: 60s
      timeout: 10s
      retries: 3

  strategy_app_finnifty:
    image: option_trading-strategy_app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      snapshot_app_finnifty:
        condition: service_healthy
    environment:
      TZ: "Asia/Kolkata"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      STRATEGY_INSTRUMENT: FINNIFTY
      STRATEGY_RUN_DIR: "/app/.run/strategy_app_finnifty"
      MARKET_SESSION_ENABLED: "${MARKET_SESSION_ENABLED:-1}"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-Asia/Kolkata}"
      MARKET_OPEN_TIME: "${MARKET_OPEN_TIME:-09:15}"
      MARKET_CLOSE_TIME: "${MARKET_CLOSE_TIME:-15:30}"
      NSE_HOLIDAYS_FILE: "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}"
      LIVE_TOPIC: "market:finnifty:snapshot:v1"
      SNAPSHOT_V1_TOPIC: "market:finnifty:snapshot:v1"
      STRATEGY_REDIS_PUBLISH_ENABLED: "1"
      STRATEGY_VOTE_TOPIC: "market:finnifty:strategy:votes:v1"
      TRADE_SIGNAL_TOPIC: "market:finnifty:strategy:signals:v1"
      STRATEGY_POSITION_TOPIC: "market:finnifty:strategy:positions:v1"
      STRATEGY_DECISION_TRACE_TOPIC: "market:finnifty:strategy:decision_trace:v1"
      # 2026-08-04: v2 -- retrained after the hist_backfill DTE bug fix (v1's
      # training data carried NIFTY's WEEKLY expiry on every FINNIFTY snapshot;
      # repaired in Mongo from the empirical straddle-collapse calendar, then
      # retrained). Holdout AUC 0.60 (v1: 0.576), Jun/Jul-2026 AUC 0.70/0.68.
      # Still fails the absolute ship gates -- threshold must come from THIS
      # bundle's real output range, not BN/NIFTY's. Empirical (8604 Jun-Jul
      # rows): sharply two-bucketed distribution, 0.4298 bucket fires ~110
      # bars/day (too loose); top-confidence bucket at 0.5738 fires ~9.3
      # bars/day (2.5%). 0.57 selects exactly that top bucket.
      ENTRY_ML_MODEL_PATH: "${FINNIFTY_ENTRY_ML_MODEL_PATH:-/app/models/finnifty_entry_015pct_v2.joblib}"
      ENTRY_ML_MIN_PROB: "${FINNIFTY_ENTRY_ML_MIN_PROB:-0.57}"
      # No FINNIFTY direction-ML bundle exists yet -- DIRECTION_ML_MODEL_PATH
      # intentionally left unset. ENTRY_DIR_W_ML explicitly zeroed (the
      # resolver's own documented way to disable the ML term) rather than left
      # at its 0.20 default with no model behind it -- a >0 weight on a dead
      # input is exactly the silent-gap failure mode the config contract's
      # weight_requires check exists to catch (see NIFTY's 2026-07-19 depth
      # incident). ML_ENTRY_DIRECTION_MODE=composite still runs its rule-based
      # terms fully.
      ENTRY_ML_MAX_NAN_FEATURES: "${FINNIFTY_ENTRY_ML_MAX_NAN_FEATURES:-2}"
      ML_ENTRY_DIRECTION_MODE: "${FINNIFTY_ML_ENTRY_DIRECTION_MODE:-composite}"
      ENTRY_DIR_W_ML: "${FINNIFTY_ENTRY_DIR_W_ML:-0}"
      # Composite's depth signal (heaviest weight) needs depth_collector_dhan_finnifty
      # live from day one -- NIFTY's own depth feed was silently dead for weeks
      # the first time this was missed (2026-07-21).
      DEPTH_FEED_ENABLED: "${DEPTH_FEED_ENABLED_FINNIFTY:-1}"
      ENTRY_BLOCK_PRE_EXPIRY: "${ENTRY_BLOCK_PRE_EXPIRY:-}"
      FINNIFTY_LOT_SIZE: "${FINNIFTY_LOT_SIZE:-60}"
      STRATEGY_MIN_CONFIDENCE: "0.05"
      # GOOD (BankNifty's stricter bar, not NIFTY's OK) -- deliberate extra
      # safety margin given this specific model's known-weak calibration;
      # grade is computed from direction-resolver signals independent of the
      # entry model's own quality, so this is the one lever that can compensate.
      RISK_LIVE_MIN_GRADE: "${FINNIFTY_RISK_LIVE_MIN_GRADE:-GOOD}"
      RISK_MAX_LOTS_PER_TRADE: "1"
      RISK_CAPITAL_ALLOCATED: "${RISK_CAPITAL_ALLOCATED:-500000}"
      RISK_PER_TRADE_PCT: "${RISK_PER_TRADE_PCT:-0.005}"
      RISK_MAX_DAILY_LOSS_PCT: "${RISK_MAX_DAILY_LOSS_PCT:-0.02}"
      RISK_MAX_SESSION_TRADES: "6"
      RISK_MAX_CONSECUTIVE_LOSSES: "3"
      ENTRY_TIERING_ENABLED: "true"
      EXIT_STRATEGY_MODE: "${EXIT_STRATEGY_MODE:-scalper}"
      EXIT_MAX_LOSS_PCT: "${EXIT_MAX_LOSS_PCT:-0.10}"
      EXIT_SCALPER_HARD_STOP_PCT: "${EXIT_SCALPER_HARD_STOP_PCT:-0.25}"
      EXIT_SCALPER_STALE_BARS: "${EXIT_SCALPER_STALE_BARS:-15}"
      ALERT_ENABLED: "${ALERT_ENABLED:-0}"
      ALERT_TELEGRAM_TOKEN: "${ALERT_TELEGRAM_TOKEN:-}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-}"
      REGIME_PANIC_REQUIRE_NONDIRECTIONAL: "${REGIME_PANIC_REQUIRE_NONDIRECTIONAL:-1}"
      REGIME_PANIC_VIX_CHG_MIN: "${REGIME_PANIC_VIX_CHG_MIN:-5.0}"
      REGIME_PANIC_RVOL_MIN: "${REGIME_PANIC_RVOL_MIN:-0.012}"
      EXIT_POLICY_STACK_ENABLED: "${EXIT_POLICY_STACK_ENABLED:-1}"
      EXIT_GIVEBACK_STOP_ENABLED: "${EXIT_GIVEBACK_STOP_ENABLED:-0}"
      EXIT_GIVEBACK_MIN_MFE: "${EXIT_GIVEBACK_MIN_MFE:-0.03}"
      EXIT_GIVEBACK_PCT: "${EXIT_GIVEBACK_PCT:-0.09}"
      STRATEGY_PROFILE_ID: "${STRATEGY_PROFILE_ID:-trader_master_ml_entry_v1}"
    command:
      - "python"
      - "-m"
      - "strategy_app.main"
      - "--engine"
      - "deterministic"
      - "--min-confidence"
      - "0.05"
      - "--strategy-profile-id"
      - "${STRATEGY_PROFILE_ID:-trader_master_ml_entry_v1}"
      - "--topic"
      - "market:finnifty:snapshot:v1"
      # 2026-08-03: starts on "paper" (Stage 3 smoke test) -- flip
      # FINNIFTY_ROLLOUT_STAGE=capped_live in .env.compose only after Stage 4/5
      # verification passes (config contract + Dhan sandbox order-path check).
      - "--rollout-stage"
      - "${FINNIFTY_ROLLOUT_STAGE:-paper}"
      - "--position-size-multiplier"
      - "${FINNIFTY_POSITION_SIZE_MULTIPLIER:-0.25}"
    volumes:
      - ./.run:/app/.run
      - ./.data/ml_pipeline:/app/.data/ml_pipeline:ro
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro
      - ./ml_pipeline_2/artifacts:/app/ml_pipeline_2/artifacts:ro
      - ./ops/strategy_config.yml:/app/ops/strategy_config.yml:ro
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-m", "strategy_app.health"]
      interval: 60s
      timeout: 10s
      retries: 3

