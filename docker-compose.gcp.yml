      # Explicit (not auto-namespace-derived) — same gotcha as NIFTY's block
      # above: persistence_app.health reads MONGO_COLL_SNAPSHOTS directly with
      # a hardcoded BN fallback, not via the instrument-aware resolver.
      MONGO_COLL_SNAPSHOTS: "phase1_market_snapshots_finnifty"
