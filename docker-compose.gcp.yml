      STRATEGY_RUN_DIR: "/app/.run/strategy_app_sim/${SIM_RUN_ID:-sim_run_id_required}"
      LIVE_TOPIC: "${LIVE_TOPIC:-market:snapshot:v1}"
      HISTORICAL_TOPIC: "${HISTORICAL_TOPIC:-market:snapshot:v1:historical}"
      SNAPSHOT_V1_TOPIC: "stream:snapshots:sim:${SIM_RUN_ID:-sim_run_id_required}"
      MONGO_COLL_SNAPSHOTS: "${MONGO_COLL_SNAPSHOTS_SIM:-phase1_market_snapshots_sim}"
      MONGO_COLL_STRATEGY_VOTES: "${MONGO_COLL_STRATEGY_VOTES_SIM:-strategy_votes_sim}"
      MONGO_COLL_TRADE_SIGNALS: "${MONGO_COLL_TRADE_SIGNALS_SIM:-trade_signals_sim}"
      MONGO_COLL_STRATEGY_POSITIONS: "${MONGO_COLL_STRATEGY_POSITIONS_SIM:-strategy_positions_sim}"
      MONGO_COLL_STRATEGY_DECISION_TRACES: "${MONGO_COLL_STRATEGY_DECISION_TRACES_SIM:-strategy_decision_traces_sim}"
      MONGO_COLL_MARKET_DEPTH_TICKS: "${MONGO_COLL_MARKET_DEPTH_TICKS_SIM:-market_depth_ticks_sim}"
      ML_PIPELINE_2_REPO_ROOT: "/app"
      STRATEGY_PROFILE_ID: "${STRATEGY_PROFILE_ID:-}"
      ENTRY_ML_MODEL_PATH: "${ENTRY_ML_MODEL_PATH:-}"
      ENTRY_ML_MIN_PROB: "${ENTRY_ML_MIN_PROB:-0.55}"
      # Optional second entry model (e.g. 10-minute-horizon compression), combined
      # with model 1 via OR: the entry trigger fires when ANY model clears its own
      # threshold. Unset -> single-model behaviour (identical to before).
      ENTRY_ML_MODEL_PATH_2: "${ENTRY_ML_MODEL_PATH_2:-}"
      ENTRY_ML_MIN_PROB_2: "${ENTRY_ML_MIN_PROB_2:-}"
      ENTRY_ML_MAX_NAN_FEATURES: "${ENTRY_ML_MAX_NAN_FEATURES:-}"
      ENTRY_ALLOW_CHOP: "${ENTRY_ALLOW_CHOP:-}"
      ENTRY_BLOCK_PRE_EXPIRY: "${ENTRY_BLOCK_PRE_EXPIRY:-}"
      ENTRY_VOL_GATE_ENABLED: "${ENTRY_VOL_GATE_ENABLED:-0}"
      ATR_ENTRY_MIN_PCT: "${ATR_ENTRY_MIN_PCT:-0.00088}"
      ATR_ENTRY_MIN_ABS: "${ATR_ENTRY_MIN_ABS:-0}"
      ATR_ENTRY_BB_MIN: "${ATR_ENTRY_BB_MIN:-0}"
      ENTRY_WINDOW_START_IST: "${ENTRY_WINDOW_START_IST:-}"
      ENTRY_WINDOW_END_IST: "${ENTRY_WINDOW_END_IST:-}"
      ENTRY_TIME_WINDOWS: "${ENTRY_TIME_WINDOWS:-}"
      ENTRY_REGIME_TAGGER: "${ENTRY_REGIME_TAGGER:-}"
      ENTRY_REGIME_ALLOWED_TAGS: "${ENTRY_REGIME_ALLOWED_TAGS:-}"
      DIRECTION_ML_MODEL_PATH: "${DIRECTION_ML_MODEL_PATH:-}"
      DIRECTION_ML_MIN_MARGIN: "${DIRECTION_ML_MIN_MARGIN:-0}"
      DIRECTION_ML_WEIGHT: "${DIRECTION_ML_WEIGHT:-0.40}"
      DIRECTION_ML_MAX_NAN_FEATURES: "${DIRECTION_ML_MAX_NAN_FEATURES:-10}"
      ML_ENTRY_DIRECTION_MODE: "${ML_ENTRY_DIRECTION_MODE:-direction_ml}"
      REGIME_GUARD_MAX_ORW: "${REGIME_GUARD_MAX_ORW:-}"
      DIRECTION_ML_CONFIDENCE_MIN: "${DIRECTION_ML_CONFIDENCE_MIN:-}"
      ENTRY_DIR_W_ML: "${ENTRY_DIR_W_ML:-0.20}"
      DIRECTION_ML_FILTER_MIN_PROB: "${DIRECTION_ML_FILTER_MIN_PROB:-}"
      ML_PURE_RUN_ID: "${ML_PURE_RUN_ID:-}"
      ML_PURE_MODEL_GROUP: "${ML_PURE_MODEL_GROUP:-}"
      ML_PURE_MODEL_PACKAGE: "${ML_PURE_MODEL_PACKAGE:-}"
      OPTION_PNL_MODEL_BUNDLE: "${OPTION_PNL_MODEL_BUNDLE:-/app/ml_pipeline_2/artifacts/option_pnl_bundles/option_pnl_atm_pe_9_20260518_063221/option_pnl_atm_pe_9_20260518_063304,/app/ml_pipeline_2/artifacts/option_pnl_bundles/option_pnl_atm_ce_9_20260518_063305/option_pnl_atm_ce_9_20260518_063335}"
      BRAIN_ENABLED: "${BRAIN_ENABLED:-true}"
      BRAIN_DAILY_FEATURES_PATH: "${BRAIN_DAILY_FEATURES_PATH:-/app/.data/ml_pipeline/daily_regime_features.json}"
      BRAIN_CONSENSUS_MIN_AGREEING: "${BRAIN_CONSENSUS_MIN_AGREEING:-1}"
      STRATEGY_IV_EXTREME_PERCENTILE: "${STRATEGY_IV_EXTREME_PERCENTILE:-95.0}"
      STRATEGY_SMART_STRIKE_ENABLED: "${STRATEGY_SMART_STRIKE_ENABLED:-0}"
      SMART_STRIKE_MAX_PREMIUM: "${SMART_STRIKE_MAX_PREMIUM:-0}"
      SMART_STRIKE_IV_REJECT_PCTILE: "${SMART_STRIKE_IV_REJECT_PCTILE:-}"
      SMART_STRIKE_OTM_CONFIDENCE: "${SMART_STRIKE_OTM_CONFIDENCE:-}"
      SMART_STRIKE_OTM_IV_CEIL: "${SMART_STRIKE_OTM_IV_CEIL:-}"
      SMART_STRIKE_OTM2_ENABLED: "${SMART_STRIKE_OTM2_ENABLED:-0}"
      SMART_STRIKE_OTM2_CONFIDENCE: "${SMART_STRIKE_OTM2_CONFIDENCE:-}"
      SMART_STRIKE_OTM2_IV_CEIL: "${SMART_STRIKE_OTM2_IV_CEIL:-}"
      SMART_STRIKE_OTM2_REGIMES: "${SMART_STRIKE_OTM2_REGIMES:-}"
      SMART_STRIKE_OTM2_MAX_BAR_HOUR: "${SMART_STRIKE_OTM2_MAX_BAR_HOUR:-}"
      SMART_STRIKE_OTM2_MIN_OI: "${SMART_STRIKE_OTM2_MIN_OI:-}"
      SMART_STRIKE_OTM3_ENABLED: "${SMART_STRIKE_OTM3_ENABLED:-0}"
      SMART_STRIKE_OTM3_CONFIDENCE: "${SMART_STRIKE_OTM3_CONFIDENCE:-}"
      SMART_STRIKE_OTM3_IV_CEIL: "${SMART_STRIKE_OTM3_IV_CEIL:-}"
      SMART_STRIKE_OTM3_REGIMES: "${SMART_STRIKE_OTM3_REGIMES:-}"
      SMART_STRIKE_OTM3_MAX_BAR_HOUR: "${SMART_STRIKE_OTM3_MAX_BAR_HOUR:-}"
      SMART_STRIKE_OTM3_MIN_OI: "${SMART_STRIKE_OTM3_MIN_OI:-}"
      SMART_STRIKE_OTM4_ENABLED: "${SMART_STRIKE_OTM4_ENABLED:-0}"
      SMART_STRIKE_OTM4_CONFIDENCE: "${SMART_STRIKE_OTM4_CONFIDENCE:-}"
      SMART_STRIKE_OTM4_IV_CEIL: "${SMART_STRIKE_OTM4_IV_CEIL:-}"
      SMART_STRIKE_OTM4_REGIMES: "${SMART_STRIKE_OTM4_REGIMES:-}"
      SMART_STRIKE_OTM4_MAX_BAR_HOUR: "${SMART_STRIKE_OTM4_MAX_BAR_HOUR:-}"
      SMART_STRIKE_OTM4_MIN_OI: "${SMART_STRIKE_OTM4_MIN_OI:-}"
      ML_ENTRY_BLOCK_PE: "${ML_ENTRY_BLOCK_PE:-0}"

      # ── Exit policy stack (E2) ─────────────────────────────────────────────
      # Master switch — set to 1 to activate. Default 0 preserves existing behaviour.
      EXIT_POLICY_STACK_ENABLED: "${EXIT_POLICY_STACK_ENABLED:-0}"
      EXIT_PREMIUM_TARGET_PCT: "${EXIT_PREMIUM_TARGET_PCT:-0.015}"
      EXIT_TRAILING_ACTIVATION_PCT: "${EXIT_TRAILING_ACTIVATION_PCT:-0.01}"
      EXIT_TRAILING_TRAIL_PCT: "${EXIT_TRAILING_TRAIL_PCT:-0.005}"
      EXIT_THESIS_FAIL_BARS: "${EXIT_THESIS_FAIL_BARS:-3}"
      EXIT_THESIS_FAIL_MIN_MFE: "${EXIT_THESIS_FAIL_MIN_MFE:-0.002}"
      # Scalper sub-stack hard loss cap (makes adaptive self-sufficient; >=1.0 disables)
      EXIT_SCALPER_HARD_STOP_PCT: "${EXIT_SCALPER_HARD_STOP_PCT:-0.25}"
      # Model-horizon timestop: entry model predicts a move within 15 min; exit
      # losing/flat positions once that window expires (June A/B: NIFTY Jun-24
      # -18.8% -> -10.6%, BN book unchanged). 0 = off.
      EXIT_SCALPER_STALE_BARS: "${EXIT_SCALPER_STALE_BARS:-15}"
      # Trade alerts (BUY/close/halt) fire from signal_logger INSIDE this container —
      # without these vars alert_open silently no-ops (found 2026-07-08: first live
      # trade produced no Telegram message).
      ALERT_ENABLED: "${ALERT_ENABLED:-0}"
      ALERT_TELEGRAM_TOKEN: "${ALERT_TELEGRAM_TOKEN:-}"
      ALERT_TELEGRAM_CHAT_ID: "${ALERT_TELEGRAM_CHAT_ID:-}"
      # PANIC regime tuning — REQUIRE_NONDIRECTIONAL suppresses PANIC on cleanly
      # directional moves (aligned 5/15/30m) so a crash is tradeable as a trend.
      # Was in .env.compose but never passed (found 2026-07-08: the -336pt NIFTY
      # fall was PANIC-blocked for its entire entry window).
      REGIME_PANIC_REQUIRE_NONDIRECTIONAL: "${REGIME_PANIC_REQUIRE_NONDIRECTIONAL:-1}"
      REGIME_PANIC_VIX_CHG_MIN: "${REGIME_PANIC_VIX_CHG_MIN:-5.0}"
      REGIME_PANIC_RVOL_MIN: "${REGIME_PANIC_RVOL_MIN:-0.012}"
      # Giveback stop (Jun-4 dead-zone fix): off by default; enable with EXIT_GIVEBACK_STOP_ENABLED=1
      EXIT_GIVEBACK_STOP_ENABLED: "${EXIT_GIVEBACK_STOP_ENABLED:-0}"
      EXIT_GIVEBACK_MIN_MFE: "${EXIT_GIVEBACK_MIN_MFE:-0.03}"
      EXIT_GIVEBACK_PCT: "${EXIT_GIVEBACK_PCT:-0.09}"
      LOTTERY_GIVEBACK_PCT: "${LOTTERY_GIVEBACK_PCT:-0.15}"

      EXIT_MAX_LOSS_PCT: "${EXIT_MAX_LOSS_PCT:-0.10}"

      # ── Near-expiry exit override (tighter stack at low DTE; off by default) ─
      EXIT_EXPIRY_OVERRIDE_ENABLED: "${EXIT_EXPIRY_OVERRIDE_ENABLED:-0}"
      EXIT_EXPIRY_DTE_THRESHOLD: "${EXIT_EXPIRY_DTE_THRESHOLD:-0}"
      EXIT_EXPIRY_HARD_STOP_PCT: "${EXIT_EXPIRY_HARD_STOP_PCT:-0.15}"
      EXIT_EXPIRY_THESIS_FAIL_BARS: "${EXIT_EXPIRY_THESIS_FAIL_BARS:-3}"
      EXIT_EXPIRY_THESIS_FAIL_MIN_MFE: "${EXIT_EXPIRY_THESIS_FAIL_MIN_MFE:-0.02}"
      EXIT_EXPIRY_TRAIL_ACTIVATION_PCT: "${EXIT_EXPIRY_TRAIL_ACTIVATION_PCT:-0.03}"
      EXIT_EXPIRY_TRAIL_PCT: "${EXIT_EXPIRY_TRAIL_PCT:-0.015}"
      EXIT_EXPIRY_PREMIUM_TARGET_PCT: "${EXIT_EXPIRY_PREMIUM_TARGET_PCT:-0.10}"

      # ── Exit strategy mode ────────────────────────────────────────────────
      EXIT_STRATEGY_MODE: "${EXIT_STRATEGY_MODE:-scalper}"
      ADAPTIVE_LOTTERY_REGIMES: "${ADAPTIVE_LOTTERY_REGIMES:-BREAKOUT,TRENDING}"
      # ── Trend-aware regime + trend-fade guard (2026-06-04 postmortem) ──────
      REGIME_TREND_ALIGNED_BONUS: "${REGIME_TREND_ALIGNED_BONUS:-0.0}"
      REGIME_TREND_SCORE_MIN: "${REGIME_TREND_SCORE_MIN:-2.0}"
      TREND_FADE_GUARD_ENABLED: "${TREND_FADE_GUARD_ENABLED:-false}"
      TREND_FADE_GUARD_VWAP_MIN: "${TREND_FADE_GUARD_VWAP_MIN:-0.001}"
      TREND_FADE_GUARD_R30M_STRONG: "${TREND_FADE_GUARD_R30M_STRONG:-0.005}"
      LOTTERY_HARD_STOP_PCT: "${LOTTERY_HARD_STOP_PCT:-0.20}"
      LOTTERY_BIG_TARGET_PCT: "${LOTTERY_BIG_TARGET_PCT:-0.50}"
      LOTTERY_RUNNER_ACTIVATION_MFE: "${LOTTERY_RUNNER_ACTIVATION_MFE:-0.20}"
      LOTTERY_RUNNER_GIVEBACK_FRAC: "${LOTTERY_RUNNER_GIVEBACK_FRAC:-0.35}"
      LOTTERY_THESIS_FAIL_BARS: "${LOTTERY_THESIS_FAIL_BARS:-5}"
      LOTTERY_THESIS_FAIL_MIN_MFE: "${LOTTERY_THESIS_FAIL_MIN_MFE:-0.03}"
      LOTTERY_TIMESTOP_BARS: "${LOTTERY_TIMESTOP_BARS:-90}"
      LOTTERY_MOMENTUM_FLIP: "${LOTTERY_MOMENTUM_FLIP:-1.0}"

      # ── Entry quality grade + live/paper tiering (E9) ─────────────────────
      # Observational: NEVER blocks. Paper takes every trade; the tier labels the
      # subset that WOULD fire on real money (live_would_take). See entry_quality.py.
      ENTRY_TIERING_ENABLED: "${ENTRY_TIERING_ENABLED:-true}"
      ENTRY_DIR_DEPTH_DECORRELATE: "${ENTRY_DIR_DEPTH_DECORRELATE:-1}"
      ENTRY_DIR_DEPTH_NET_CAP: "${ENTRY_DIR_DEPTH_NET_CAP:-1.1}"
      ENTRY_QUALITY_GOOD_AT: "${ENTRY_QUALITY_GOOD_AT:-0.8}"
      ENTRY_QUALITY_BAD_BELOW: "${ENTRY_QUALITY_BAD_BELOW:-0.5}"
      ENTRY_QUALITY_MARGIN_GOOD: "${ENTRY_QUALITY_MARGIN_GOOD:-2.0}"
      ENTRY_QUALITY_MARGIN_WEAK: "${ENTRY_QUALITY_MARGIN_WEAK:-1.0}"
      ENTRY_QUALITY_MAX_DEPTH_SHARE: "${ENTRY_QUALITY_MAX_DEPTH_SHARE:-0.6}"
      ENTRY_QUALITY_CHOP_REGIMES: "${ENTRY_QUALITY_CHOP_REGIMES:-SIDEWAYS,CHOP,UNKNOWN}"
      ENTRY_QUALITY_IV_SKEW_BAND: "${ENTRY_QUALITY_IV_SKEW_BAND:-0.08}"
      ENTRY_QUALITY_PEN_MARGIN_THIN: "${ENTRY_QUALITY_PEN_MARGIN_THIN:-0.5}"
      ENTRY_QUALITY_PEN_MARGIN_MILD: "${ENTRY_QUALITY_PEN_MARGIN_MILD:-0.2}"
      ENTRY_QUALITY_PEN_DEPTH_DOM: "${ENTRY_QUALITY_PEN_DEPTH_DOM:-0.3}"
      ENTRY_QUALITY_PEN_CHOP_REGIME: "${ENTRY_QUALITY_PEN_CHOP_REGIME:-0.3}"
      ENTRY_QUALITY_PEN_STALE_MOMENTUM: "${ENTRY_QUALITY_PEN_STALE_MOMENTUM:-0.3}"
      ENTRY_QUALITY_PEN_IV_DISAGREE: "${ENTRY_QUALITY_PEN_IV_DISAGREE:-0.2}"
      RISK_LIVE_MIN_GRADE: "${RISK_LIVE_MIN_GRADE:-GOOD}"
      RISK_LIVE_MIN_WINRATE: "${RISK_LIVE_MIN_WINRATE:-0.0}"
      RISK_LIVE_WINRATE_MIN_TRADES: "${RISK_LIVE_WINRATE_MIN_TRADES:-5}"
    command:
      [
        "python",
        "-m",
        "strategy_app.main",
        "--engine",
        "${STRATEGY_ENGINE:-deterministic}",
        "--min-confidence",
        "${STRATEGY_MIN_CONFIDENCE:-0.65}",
        "--strategy-profile-id",
        "${STRATEGY_PROFILE_ID:-}",
        "--topic",
        "stream:snapshots:sim:${SIM_RUN_ID:-sim_run_id_required}",
        "--run-dir",
        "/app/.run/strategy_app_sim/${SIM_RUN_ID:-sim_run_id_required}",
        "--rollout-stage",
        "${STRATEGY_ROLLOUT_STAGE_HISTORICAL:-paper}",
        "--position-size-multiplier",
        "${STRATEGY_POSITION_SIZE_MULTIPLIER_HISTORICAL:-1.0}",
      ]
    volumes:
      - ./.run:/app/.run
      - ./.data/ml_pipeline:/app/.data/ml_pipeline:ro
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro
      - ./ml_pipeline_2/artifacts:/app/ml_pipeline_2/artifacts:ro
      - ./ops/strategy_config.yml:/app/ops/strategy_config.yml:ro

  # Spawned per-run by SIM orchestrator alongside strategy_app_sim:
  #   docker compose run --rm -d -e SIM_RUN_ID=<rid> strategy_persistence_sim
  # Consumes per-run SIM streams (votes/signals/positions/decision_trace) and
  # writes to the *_sim mongo collections for the REPLAY UI.
  strategy_persistence_sim:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: persistence_app/Dockerfile
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: "${MONGO_DB:-trading_ai}"
      SIM_RUN_ID: "${SIM_RUN_ID:-sim_run_id_required}"
      MONGO_COLL_STRATEGY_VOTES: "${MONGO_COLL_STRATEGY_VOTES_SIM:-strategy_votes_sim}"
      MONGO_COLL_TRADE_SIGNALS: "${MONGO_COLL_TRADE_SIGNALS_SIM:-trade_signals_sim}"
      MONGO_COLL_STRATEGY_POSITIONS: "${MONGO_COLL_STRATEGY_POSITIONS_SIM:-strategy_positions_sim}"
      MONGO_COLL_STRATEGY_DECISION_TRACES: "${MONGO_COLL_STRATEGY_DECISION_TRACES_SIM:-strategy_decision_traces_sim}"
      MARKET_SESSION_ENABLED: "0"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-Asia/Kolkata}"
      MARKET_OPEN_TIME: "${MARKET_OPEN_TIME:-09:15}"
      MARKET_CLOSE_TIME: "${MARKET_CLOSE_TIME:-15:30}"
      NSE_HOLIDAYS_FILE: "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}"
    command:
      ["python", "-m", "persistence_app.main_strategy_stream_consumer", "--health-log-interval-sec", "30"]
    volumes:
      - ./.run:/app/.run
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro

  # Re-enabled 2026-05-16 after Stage 3 hardening landed (commit bb36eef): decoupled
  # writer thread, bounded queue, pubsub recovery on error, env-configurable mongo
  # timeouts (default 30s socket, was 5s). Replay no longer triggers silent hang.
  # Per ARCHITECTURE.md §9 target architecture, this consumer now serves as a load
  # test for the live persistence path — same code, exercised under the heavier
  # replay event rate before live trading needs it.
  strategy_persistence_app_historical:
    profiles: ["historical"]
    build:
      context: .
      dockerfile: persistence_app/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      strategy_app_historical:
        condition: service_started
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: "${MONGO_DB:-trading_ai}"
      MARKET_SESSION_ENABLED: "0"
      MARKET_TIMEZONE: "${MARKET_TIMEZONE:-Asia/Kolkata}"
      MARKET_OPEN_TIME: "${MARKET_OPEN_TIME:-09:15}"
      MARKET_CLOSE_TIME: "${MARKET_CLOSE_TIME:-15:30}"
      NSE_HOLIDAYS_FILE: "${NSE_HOLIDAYS_FILE:-/app/config/nse_holidays.json}"
      STRATEGY_VOTE_TOPIC: "${STRATEGY_VOTE_TOPIC_HISTORICAL:-market:strategy:votes:v1:historical}"
      TRADE_SIGNAL_TOPIC: "${TRADE_SIGNAL_TOPIC_HISTORICAL:-market:strategy:signals:v1:historical}"
      STRATEGY_POSITION_TOPIC: "${STRATEGY_POSITION_TOPIC_HISTORICAL:-market:strategy:positions:v1:historical}"
      STRATEGY_DECISION_TRACE_TOPIC: "${STRATEGY_DECISION_TRACE_TOPIC_HISTORICAL:-market:strategy:decision_trace:v1:historical}"
      MONGO_COLL_STRATEGY_VOTES: "${MONGO_COLL_STRATEGY_VOTES_HISTORICAL:-strategy_votes_historical}"
      MONGO_COLL_TRADE_SIGNALS: "${MONGO_COLL_TRADE_SIGNALS_HISTORICAL:-trade_signals_historical}"
      MONGO_COLL_STRATEGY_POSITIONS: "${MONGO_COLL_STRATEGY_POSITIONS_HISTORICAL:-strategy_positions_historical}"
      MONGO_COLL_STRATEGY_DECISION_TRACES: "${MONGO_COLL_STRATEGY_DECISION_TRACES_HISTORICAL:-strategy_decision_traces_historical}"
    command:
      [
        "python",
        "-m",
        "persistence_app.main_strategy_consumer",
        "--foreground",
        "--vote-topic",
        "${STRATEGY_VOTE_TOPIC_HISTORICAL:-market:strategy:votes:v1:historical}",
        "--signal-topic",
        "${TRADE_SIGNAL_TOPIC_HISTORICAL:-market:strategy:signals:v1:historical}",
        "--position-topic",
        "${STRATEGY_POSITION_TOPIC_HISTORICAL:-market:strategy:positions:v1:historical}",
        "--trace-topic",
        "${STRATEGY_DECISION_TRACE_TOPIC_HISTORICAL:-market:strategy:decision_trace:v1:historical}",
      ]
    volumes:
      - ./.run:/app/.run
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-m",
          "persistence_app.strategy_health",
          "--max-age-seconds",
          "300",
        ]
      interval: 60s
      timeout: 10s
      retries: 3

  # ═══════════════════════════════════════════════════════════════════════════
  # NIFTY PARALLEL STACK
  # Mirrors BankNifty services but scoped to NIFTY via STRATEGY_INSTRUMENT.
  # Uses the SAME images — only env vars differ.
  # Namespace: *_nifty collections, market:nifty:* topics, separate run-dir.
  # Launch: docker compose up -d ingestion_app_nifty snapshot_app_nifty
  #                               strategy_app_nifty strategy_persistence_app_nifty
  # ═══════════════════════════════════════════════════════════════════════════

  ingestion_app_nifty:
    image: option_trading-ingestion_app
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      TZ: "Asia/Kolkata"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "${REDIS_DB:-0}"
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
      MONGO_DB: "${MONGO_DB:-trading_ai}"
      STRATEGY_INSTRUMENT: NIFTY
      INSTRUMENT_SYMBOL: "${NIFTY_INSTRUMENT_SYMBOL:-NIFTY26JULFUT}"
      BROKER: dhan
