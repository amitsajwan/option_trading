        "--ml-pure-max-feature-age-sec",
        "${ML_PURE_MAX_FEATURE_AGE_SEC_HISTORICAL:-0}",
      ]
    volumes:
      - ./.run:/app/.run
      - ./.data/ml_pipeline:/app/.data/ml_pipeline:ro
      - ./config/nse_holidays.json:/app/config/nse_holidays.json:ro
      - ./ml_pipeline_2/artifacts:/app/ml_pipeline_2/artifacts:ro
      - ./ops/strategy_config.yml:/app/ops/strategy_config.yml:ro
    healthcheck:
      test: ["CMD", "python", "-m", "strategy_app.health"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Spawned per-run by SIM orchestrator via:
  #   docker compose --env-file .env.compose run --rm -d -e SIM_RUN_ID=<rid> strategy_app_sim
  # Not part of default `docker compose up`; kept under a dedicated profile.
  strategy_app_sim:
    profiles: ["sim"]
    build:
      context: .
      dockerfile: strategy_app/Dockerfile
    restart: "no"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # --- SIM=LIVE parity: mirrored from strategy_app env (added 2026-06-21) ---
      TZ: "Asia/Kolkata"
      ML_PURE_THRESHOLD_REPORT: "${ML_PURE_THRESHOLD_REPORT:-}"
